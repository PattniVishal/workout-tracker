name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test

      - name: Package application
        run: ./mvnw -B -DskipTests package

      - name: Verify Docker image builds
        working-directory: ${{ github.workspace }}
        run: docker build -t workout-tracker-backend:ci ./backend

  docker-compose-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        env:
          POSTGRES_PASSWORD: ci-compose-password
          DATABASE_PASSWORD: ci-compose-password
        run: docker compose -f compose.yaml config

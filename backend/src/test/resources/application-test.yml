spring:
  datasource:
    url: jdbc:h2:mem:workout_tracker_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    placeholders:
      exercise_secondary_muscle_groups_column: secondary_muscle_groups VARCHAR(50) ARRAY NOT NULL DEFAULT ARRAY[],
      workout_session_partial_indexes: ''

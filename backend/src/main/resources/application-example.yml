# Example local configuration. Do not commit real credentials.
#
# Prefer environment variables:
#   DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
#
# Or copy backend/.env.example to backend/.env (gitignored) for local development.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/workout_tracker
    username: postgres
    password: change_me
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      cookie:
        # Local HTTP development: leave false (default). Production: use profile prod or SESSION_COOKIE_SECURE=true.
        secure: false

app:
  cors:
    allowed-origins: http://localhost:5173

spring:
  application:
    name: workout-tracker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/workout_tracker}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      exercise_secondary_muscle_groups_column: secondary_muscle_groups VARCHAR(50)[] NOT NULL DEFAULT '{}',
      workout_session_partial_indexes: |
        CREATE UNIQUE INDEX uk_workout_session_user_in_progress
            ON workout_session (user_id)
            WHERE status = 'IN_PROGRESS';

        CREATE INDEX idx_workout_session_user_completed
            ON workout_session (user_id, completed_at DESC)
            WHERE status = 'COMPLETED';

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    com.workouttracker: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
